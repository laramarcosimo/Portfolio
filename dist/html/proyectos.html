    <!-- Script para Máquina de Escribir y Scroll 300vh -->

    <script>

        document.addEventListener("DOMContentLoaded", () => {

            const initIdentitySection = (clonedSection, gallery) => {

                const layers = clonedSection.querySelectorAll('.capa-color');



                // [MODIFICADO] Efecto fluido vinculado al scroll con Lerp (Límite de velocidad nativo)

                let isAnimating = true;



                layers.forEach(layer => layer._currentProgress = 0);



                const tick = () => {

                    if (!document.body.contains(clonedSection)) {

                        isAnimating = false;

                        return;

                    }



                    const windowHeight = window.innerHeight;



                    layers.forEach(layer => {

                        const rect = layer.getBoundingClientRect();



                        // [MODIFICADO] Recorrido adaptativo: Usa toda la pantalla en móvil para mayor fluidez

                        const isMobile = window.innerWidth <= 768;

                        const start = windowHeight * (isMobile ? 1.1 : 0.95);

                        // [MODIFICADO] En móvil termina al 55% para garantizar que el último bloque complete su recorrido sin quedarse atascado en el tope del scroll

                        const end = windowHeight * (isMobile ? 0.55 : 0.40);



                        let p = (start - rect.top) / (start - end);

                        let target = Math.max(0, Math.min(1, p));



                        const diff = target - layer._currentProgress;



                        if (Math.abs(diff) > 0.0001) {

                            const lerpSpeed = isMobile ? 0.3 : 0.04;

                            layer._currentProgress += diff * lerpSpeed;



                            // [NUEVO] Forzar encaje perfecto (snap) cuando está a punto de llegar, cerrando el hueco milimétrico

                            if (Math.abs(target - layer._currentProgress) < 0.002) {

                                layer._currentProgress = target;

                            }



                            layer.style.setProperty('--scroll-progress', layer._currentProgress);

                        }



                        // [MODIFICADO] Máquina de Escribir condicionada a la dirección del scroll

                        if (target > 0.5 && diff > 0) {

                            // Solo se activa si han rebasado la mitad del trayecto Y se están acercando

                            if (layer.dataset.typed !== "true") {

                                layer.dataset.typed = "true";

                                startTypewriter(layer);

                            }

                        } else if (rect.top > windowHeight || rect.bottom < 0 || target < 0.1) {

                            // Se borra si salen de la pantalla o si se han separado por completo

                            if (layer.dataset.typed !== "false") {

                                layer.dataset.typed = "false";

                                const lines = layer.querySelectorAll('.tw-line');

                                lines.forEach(line => line.innerHTML = '');

                                const logos = layer.querySelectorAll('.logo-fade');

                                logos.forEach(logo => logo.classList.remove('visible'));

                            }

                        }

                    });



                    if (isAnimating) requestAnimationFrame(tick);

                };

                requestAnimationFrame(tick);



                function startTypewriter(layer) {

                    const lines = layer.querySelectorAll('.tw-line');

                    const logos = layer.querySelectorAll('.logo-fade');

                    let delay = 0;



                    lines.forEach((line) => {

                        const fullText = line.getAttribute('data-text');

                        line.innerHTML = ''; // Limpiamos para inyectar



                        setTimeout(() => {

                            // Si durante el tiempo de espera el usuario subió el scroll, cancelamos la inyección

                            if (layer.dataset.typed !== "true") return;



                            let charIndex = 0;

                            const cursor = document.createElement('span');

                            cursor.className = 'tw-cursor';

                            cursor.textContent = '|';

                            line.appendChild(cursor);



                            const typeInterval = setInterval(() => {

                                if (layer.dataset.typed !== "true") {

                                    clearInterval(typeInterval); // Detener la escritura si se pierde de vista

                                    return;

                                }

                                if (charIndex < fullText.length) {

                                    cursor.insertAdjacentText('beforebegin', fullText.charAt(charIndex));

                                    charIndex++;

                                } else {

                                    clearInterval(typeInterval);

                                    cursor.remove(); // Se borra para pasar a la siguiente línea

                                }

                            }, 40); // 40ms estricto

                        }, delay);



                        delay += (fullText.length * 40) + 200; // Retraso calculado acumulativo

                    });



                    // Al finalizar todo, devolvemos el cursor parpadeante permanente a la última línea y revelamos el logo

                    setTimeout(() => {

                        if (layer.dataset.typed !== "true") return;



                        const lastLine = lines[lines.length - 1];

                        if (lastLine) {

                            const finalCursor = document.createElement('span');

                            finalCursor.className = 'tw-cursor';

                            finalCursor.textContent = '|';

                            lastLine.appendChild(finalCursor);

                        }

                        logos.forEach(logo => logo.classList.add('visible')); // Fade-in suave de los logos

                    }, delay + 100);

                }

            };



            // Vigila la generación de los clones del "Universo Paralelo" para inicializar la lógica dinámicamente

            const mutObserver = new MutationObserver(() => {

                document.querySelectorAll('.seccion-identidad:not(.initialized)').forEach(section => {

                    const gallery = section.closest('.parallel-gallery');

                    if (gallery) {

                        section.classList.add('initialized');

                        setTimeout(() => initIdentitySection(section, gallery), 50);

                    }

                });

            });

            mutObserver.observe(document.body, { childList: true, subtree: true });

        });

    </script>
